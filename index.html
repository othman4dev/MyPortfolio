  <header class="header">
    <div class="mobile-island">
      <div

        ontouchend="handleDoubleTap()"

      <div class="ping">

        <a href="assets/cv/OTMAN_KHARBOUCH_FULLSTACK_FR.pdf" download>

    <div class="quote">
      <h3 class="quote-text text-animate" data-translate="quote"></h3>

  <body>
    <div id="lens-effect"></div>
    <div class="fixed">
      <div class="side-bar">
        <div class="sidebar-links">
          <a href="https://github.com/othman4dev" target="_blank">
            <div class="sidebar-link">
              <i class="bi bi-github"></i>
            </div>
          </a>
          <a href="https://www.linkedin.com/in/otman-kharbouch-ba44552a1/" target="_blank">
            <div class="sidebar-link">
              <i class="bi bi-linkedin"></i>
            </div>
          </a>
          <a href="https://www.instagram.com/othman.is.me/" target="_blank">
            <div class="sidebar-link">
              <i class="bi bi-instagram"></i>
            </div>
          </a>
          <a href="https://wa.me/212704606597" target="_blank">
            <div class="sidebar-link">
              <i class="bi bi-whatsapp"></i>
            </div>
          </a>
        </div>
        <div>
          <div class="cv-downloader">
            <a href="assets/cv/OTMAN_KHARBOUCH_FULLSTACK_FR.pdf" download>
              <button class="download-btn" title="Download CV">
                <i class="bi bi-person-vcard"></i>
                <p class="download-text" data-translate="cv"></p>
              </button>
            </a>
          </div>
          <div class="lang-changer" onblur="chooseLang()">
            <button class="download-btn" onclick="chooseLang()">
              <i class="bi bi-globe2"></i>
              <p class="download-text" data-translate="lang"></p>
            </button>
            <div class="lang-modal" id="langModal">
              <button class="lang-option" onclick="
                  setLang('en');
                  chooseLang();
                ">
                <span class="fi fi-us"></span>
              </button>
              <button class="lang-option" onclick="
                  setLang('fr');
                  chooseLang();
                ">
                <span class="fi fi-fr"></span>
              </button>
              <button class="lang-option lang-disabled" title="Currently unavailable">
                <span class="fi fi-sa"></span>
              </button>
            </div>
          </div>
        </div>
        <div id="connection-status" class="speed-test">
          <i id="status-icon" class="bi bi-wifi-off text-danger"></i>
          <span id="status-text1" class="status-text">Offline</span>
          <span id="ping-value1" class="speed"></span>
          <br />
          <span id="time"></span>
        </div>
      </div>
      <div class="indexer">
        <div class="line-full" id="lineFull"></div>
        <p id="index" class="current-index index-text" data-translate="PROFILE"></p>
        <div class="line-half" id="lineHalf2">
          <div class="next-index"></div>
          <p class="next-index-text index-text" id="next-index" data-translate="ABOUT"></p>
        </div>
      </div>

        <div class="hero-profile">

          </div>
          <div class="hero-texts">
            <h1 class="hero-title" data-translate="name"></h1>
            <p class="hero-subtitle text-animate" data-translate="profession"></p>
            <p class="hero-description text-animate" data-translate="description"></p>
          </div>
          <div class="hero-img">
            <img src="assets/images/portrait.webp" class="othman-img" alt="Othman Kharbouch portrait" />
          </div>
        </div>
      </div>
    </main>
