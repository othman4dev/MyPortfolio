    color: #f0f0f0;
  }
  html::-webkit-scrollbar {
    width: 7px;
    background-color: #314466;
  }
  html::-webkit-scrollbar-thumb {
    background-color: #1f293b;
    border-radius: 10px;
  }
</style>
<script>
  const statusIcon = document.getElementById("status-icon");
  const statusText = document.getElementById("status-text");
  const pingValue = document.getElementById("ping-value");

  const statusIcon1 = document.getElementById("status-icon1");
  const statusText1 = document.getElementById("status-text1");
  const pingValue1 = document.getElementById("ping-value1");

  async function measurePing() {
    const pingUrl = "assets/images/otman_favicon.png";
    const start = performance.now();
    try {
      await fetch(pingUrl, { method: "HEAD", cache: "no-store" });
      const ping = Math.round(performance.now() - start);
      updateStatus(true, ping);
    } catch {
      updateStatus(false);
    }
  }

  function updateStatus(isOnline, ping = null) {
    if (isOnline) {
      statusIcon.className = "bi bi-wifi text-success";
      statusText.textContent = "Online";
      pingValue.textContent = ping !== null ? `${ping} ms` : "";
      statusIcon1.className = "bi bi-wifi text-success";
      statusText1.textContent = "Online";
      pingValue1.textContent = ping !== null ? `${ping} ms` : "";
    } else {
      statusIcon.className = "bi bi-wifi-off text-danger";
      statusText.textContent = "Offline";
      pingValue.textContent = "";
      statusIcon1.className = "bi bi-wifi-off text-danger";
      statusText1.textContent = "Offline";
      pingValue1.textContent = "";
    }
  }

  // Check connection every 10 seconds
  setInterval(measurePing, 10000);
  window.addEventListener("online", measurePing);
  window.addEventListener("offline", () => updateStatus(false));

  measurePing();

  async function setLang(lang) {
    if (localStorage.getItem("lang")) {
      localStorage.removeItem("lang");
      localStorage.setItem("lang", lang);
    } else {
      localStorage.setItem("lang", lang);
    }

    /* notify(
    "bi-globe2",
    lang === "fr"
      ? "La langue a été définie sur le français"
      : "Language has been set to English",
  ); */

    const basePath = window.location.pathname.includes("/pages/")
      ? "../"
      : "./";
    const response = await fetch(`${basePath}lang/${lang}.json`);
    const translations = await response.json();

    document.querySelectorAll("[data-translate]").forEach((el) => {
      const key = el.getAttribute("data-translate");
      el.innerHTML = translations[key] || key;
    });

    // Optionally store lang in localStorage
    localStorage.setItem("lang", lang);
    // update current language circle in header
    try {
      const current = document.getElementById("currentLang");
      if (current) {
        const map = { en: "fi fi-us", fr: "fi fi-fr", ar: "fi fi-sa" };
        const cls = map[lang] || "fi fi-us";
        current.innerHTML = `<span class="${cls}"></span>`;
      }
    } catch (e) {}
  }
  // Load language from localStorage on page load
  window.addEventListener("DOMContentLoaded", () => {
    const savedLang = localStorage.getItem("lang") || "en";
    document.documentElement.setAttribute("lang", savedLang);

    setLang(savedLang);
  });

  // Initial check
  document.getElementById("time").innerText = new Date().toLocaleTimeString(
    "en-US",
    {
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
    },
  );

  setInterval(() => {
    document.getElementById("time").innerText = new Date().toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
      },
    );
  }, 1000);
</script>
